# https://jgrulich.cz/2024/12/13/when-your-webcam-doesnt-work-solving-firefox-and-pipewire-issues/
# https://web.archive.org/web/20260310031455/https://jgrulich.cz/2024/12/13/when-your-webcam-doesnt-work-solving-firefox-and-pipewire-issues/
#
# Fixes:
#
# $ wpctl status
#
# Video
#  ├─ Devices:
#  │      35. Integrated Camera: Integrated I     [libcamera]
#  │      62. Integrated Camera: Integrated C     [libcamera]
#  │
#  ├─ Sources:
#  │  *   67. Built-in Front Camera
#  │      69. Built-in Front Camera
#
# Instead of showing in "Sources":
#             Integrated Camera (V4L2)
#
# Restart after setting config:
#     systemctl --user restart pipewire wireplumber
#
# https://mozilla.github.io/webrtc-landing/gum_test.html
#
# Comment mentions to disable `media.webrtc.camera.allow-pipewire`

wireplumber.profiles = {
    main = {
        monitor.v4l2 = disabled
        monitor.libcamera = optional
    }
}
